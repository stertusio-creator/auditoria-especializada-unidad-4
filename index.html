function ensureWork(id, i) {

  if (act === "quiz") return go({ name: "quiz", id });
  if (act === "bucket") {
    const i = Number(el.dataset.i);
    const work = ensureWork(id, i);
    if (work.done) return;
    work.picks[el.dataset.item] = el.dataset.bucket;
    save();
    render();
    return;
  }
  if (act === "check") {
    const i = Number(el.dataset.i);
    const mod = LESSONS[id].modules[i];
    const work = ensureWork(id, i);
    if (work.done) return;
    if (mod.activity.type === "classify") {
      const pending = mod.activity.items.some((it) => !work.picks[it.id]);
      if (pending) { alert("Clasifica todas las ideas antes de comprobar."); return; }
      work.ok = mod.activity.items.every((it) => work.picks[it.id] === it.bucket);
    } else if (mod.activity.type === "match") {
      const pending = mod.activity.pairs.some((_, idx) => work.picks[idx] === undefined || work.picks[idx] === "");
      if (pending) { alert("Completa todos los pares antes de comprobar."); return; }
      work.ok = mod.activity.pairs.every((_, idx) => String(work.picks[idx]) === String(idx));
    }
    work.done = true;
    state.readings[id].modules[i] = true;
    save();
    render();
    return;
  }
  if (act === "scenario") {
    const i = Number(el.dataset.i);
    const work = ensureWork(id, i);
    if (work.done) return;
    const choice = Number(el.dataset.choice);
    work.picks.choice = choice;
    work.ok = !!LESSONS[id].modules[i].activity.options[choice].ok;
    work.done = true;
    state.readings[id].modules[i] = true;
    save();
    render();
    return;
  }
  if (act === "quiz-opt") {
    const qz = ensureQuiz(id);
    if (qz.done || qz.picks[qz.step] !== undefined) return;
    qz.picks[qz.step] = Number(el.dataset.choice);
    save();
    render();
    return;
  }
  if (act === "quiz-next") {
    const qz = ensureQuiz(id);
    if (qz.picks[qz.step] === undefined) return;
    if (qz.step < 9) qz.step += 1;
    else {
      qz.done = true;
      qz.score = LESSONS[id].quiz.reduce((s, q, i) => s + (qz.picks[i] === q.a ? 1 : 0), 0);
    }
    save();
    render();
    window.scrollTo(0, 0);
    return;
  }
  if (act === "retry") {
    state.readings[id].quiz = { step: 0, picks: {}, done: false, score: 0 };
    save();
    render();
    window.scrollTo(0, 0);
  }
});
document.getElementById("app").addEventListener("change", (ev) => {
  const el = ev.target.closest("[data-act='match']");
  if (!el) return;
  const id = el.dataset.id;
  const i = Number(el.dataset.i);
  const work = ensureWork(id, i);
  if (work.done) return;
  work.picks[el.dataset.left] = el.value;
  save();
});
load();
if (!state.view || !state.view.name) state.view = { name: "home" };
render();
</script>
